name: App Deploy (Vercel)

# نشر البوت الحي إلى Vercel Production
# يدوياً: Actions → App Deploy (Vercel) → Run workflow = زر إعادة النشر/Restart

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  tests:
    name: اختبارات ما قبل النشر
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت الاعتماديات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q --no-header -p no:cacheprovider

  deploy:
    name: نشر Vercel Production
    needs: tests
    runs-on: ubuntu-latest
    # النشر ذكي: يعمل تلقائياً فور توفر أسرار Vercel، ويُتخطّى بتحذير دونها.
    if: >-
      secrets.VERCEL_TOKEN != '' &&
      secrets.VERCEL_ORG_ID != '' &&
      secrets.VERCEL_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: سحب إعدادات المشروع من Vercel
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: بناء الإنتاج
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: نشر الإنتاج
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  vercel-pending:
    name: "⏸️ تنبيه: نشر Vercel مؤجّل"
    needs: tests
    runs-on: ubuntu-latest
    # يعمل فقط عند غياب أسرار Vercel — تحذير أصفر صريح بدل فشل أحمر.
    if: >-
      secrets.VERCEL_TOKEN == '' ||
      secrets.VERCEL_ORG_ID == '' ||
      secrets.VERCEL_PROJECT_ID == ''
    steps:
      - name: تحذير الأسرار الناقصة
        run: |
          echo "::warning::أسرار Vercel غير مضبوطة بعد — النشر مؤجّل حتى إضافتها."
          echo "::warning::أضف VERCEL_TOKEN و VERCEL_ORG_ID و VERCEL_PROJECT_ID من Settings → Secrets and variables → Actions (كـ Secrets وليس Variables)"
          echo "::warning::بعد الإضافة، أعِد تشغيل الـ workflow وسيبدأ النشر تلقائياً. الاختبارات نجحت."
