name: database-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1) اختبارات الكود — حارس انحدار منطق البوت المالي
  # ─────────────────────────────────────────────────────────────
  tests:
    name: اختبارات الكود (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت التبعيات
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: تشغيل كامل المنظومة الاختبارية
        run: python -m pytest -q

  # ─────────────────────────────────────────────────────────────
  # 2) التحقق من المخطط — Postgres 16 نظيف بلا أي أسرار
  #    يثبت: يُطبَّق من صفحة بيضاء + قابل لإعادة التطبيق (Idempotent)
  # ─────────────────────────────────────────────────────────────
  db-validate:
    name: "التحقق من المخطط — ${{ matrix.scenario == 'fresh' && 'صفحة بيضاء' || 'محاكاة قاعدة قديمة (001+002)' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, legacy]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mahrokat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: تهيئة أدوار Supabase المعيارية (محاكاة Supabase على Postgres خام)
        run: >
          psql -h localhost -U postgres -d mahrokat -v ON_ERROR_STOP=1
          -f supabase/ci_bootstrap.sql

      - name: محاكاة قاعدة قديمة — تطبيق 001+002 الأصليين (سيناريو legacy فقط)
        if: matrix.scenario == 'legacy'
        run: |
          psql -h localhost -U postgres -d mahrokat -v ON_ERROR_STOP=1 -f migrations/archive/001_init.sql
          psql -h localhost -U postgres -d mahrokat -v ON_ERROR_STOP=1 -f migrations/archive/002_accountant_alerts.sql

      - name: تطبيق المخطط الموحد — الضربة الأولى
        run: >
          psql -h localhost -U postgres -d mahrokat -v ON_ERROR_STOP=1
          -f supabase/migrations/20260902000000_master_schema.sql

      - name: إعادة التطبيق — إثبات Idempotency (يجب أن ينجح ثانية)
        run: >
          psql -h localhost -U postgres -d mahrokat -v ON_ERROR_STOP=1
          -f supabase/migrations/20260902000000_master_schema.sql

      - name: مطابقة الكائنات (6 جداول / 6 Views / 5 دوال / 4 إعدادات)
        run: >
          psql -h localhost -U postgres -d mahrokat -v ON_ERROR_STOP=1
          -f supabase/verify_schema.sql

  # ─────────────────────────────────────────────────────────────
  # 3) النشر إلى Supabase — بعد نجاح الفحصين فقط، وعلى master
  #    يتطلب 3 أسرار في إعدادات المستودع (انظر docs/DEPLOYMENT.md)
  # ─────────────────────────────────────────────────────────────
  db-deploy:
    name: النشر إلى Supabase (Production)
    needs: [tests, db-validate]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: فحص مسبق لكلمة مرور قاعدة البيانات (تنظيف الحواف + حارس الفراغ)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::السرّ SUPABASE_DB_PASSWORD فارغ أو غير معرّف — أضفه من Settings → Secrets and variables → Actions"
            exit 1
          fi
          TRIMMED="$(printf '%s' "${SUPABASE_DB_PASSWORD}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$TRIMMED" ]; then
            echo "::error::كلمة المرور مسافات فقط — أعد إدخال كلمة مرور قاعدة البيانات الفعلية"
            exit 1
          fi
          echo "تم التنظيف — طول كلمة المرور: ${#TRIMMED} حرفاً (القيمة نفسها لا تُعرض أبداً)"
          echo "SUPABASE_DB_PASSWORD=$TRIMMED" >> "$GITHUB_ENV"

      - name: التحقق من رمز الوصول (Access Token)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN غير معرّف — أضفه من Settings → Secrets and variables → Actions"
            exit 1
          fi
          # تحقّق من أن الرمز ليس فارغاً أو مسافات
          TRIMMED_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$TRIMMED_TOKEN" ]; then
            echo "::error::رمز الوصول مسافات فقط — أعد إدخال رمز الوصول الفعلي"
            exit 1
          fi
          echo "✅ رمز الوصول موجود (طوله: ${#TRIMMED_TOKEN} حرفاً) — القيمة لا تُعرض أبداً"
          echo "SUPABASE_ACCESS_TOKEN=$TRIMMED_TOKEN" >> "$GITHUB_ENV"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: ربط المشروع ونشر الترحيلات
        run: |
          echo "جارٍ ربط المشروع ${SUPABASE_PROJECT_ID}…"
          # --password صريح لتجنب الفشل الصامت في الوضع غير التفاعلي
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD" 2>&1 || {
            echo "::error::فشل ربط المشروع — تحقق من PROJECT_ID وكلمة المرور."
            echo "الأسباب المحتملة:"
            echo "  - رمز الوصول غير صالح أو منتهي الصلاحية"
            echo "  - معرّف المشروع غير صحيح"
            echo "  - كلمة مرور قاعدة البيانات خاطئة"
            exit 1
          }
          echo "✅ تم ربط المشروع بنجاح"

          echo "جارٍ نشر الترحيلات…"
          # --include-all: يدفع كل الترحيلات + الأدوار + السياسات
          supabase db push --include-all --debug 2>&1 || {
            EXIT_CODE=$?
            echo "::error::فشل نشر الترحيلات (كود الخطأ: $EXIT_CODE)"
            exit $EXIT_CODE
          }
          echo "✅ اكتمل النشر بنجاح"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: تلميح التشخيص عند فشل النشر
        if: failure()
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo " تشخيص فشل النشر — الأسباب الأكثر احتمالاً:"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "1️⃣ رمز الوصول (Access Token) غير صالح أو منتهي:"
          echo "   → Supabase → Account → Access Tokens → Regenerate"
          echo "   → GitHub Secrets → حدّث SUPABASE_ACCESS_TOKEN"
          echo ""
          echo "2️⃣ كلمة مرور قاعدة البيانات خاطئة:"
          echo "   → Supabase → Project Settings → Database → Reset password"
          echo "   → GitHub Secrets → حدّث SUPABASE_DB_PASSWORD"
          echo ""
          echo "3️⃣ معرّف المشروع (Project ID) غير صحيح:"
          echo "   → تحقّق من أنه 'Ref' ليس 'ID' الكامل"
          echo "   → مثال صحيح: axbhjklmnopqrstuv (16 حرفاً)"
          echo ""
          echo "4️⃣ جدار حماية يحجب GitHub Actions:"
          echo "   → Supabase → Project Settings → API → Network Restrictions"
          echo ""
          echo "🔄 بعد الإصلاح: Re-run this workflow from Actions tab."
          echo "═══════════════════════════════════════════════════════════"
